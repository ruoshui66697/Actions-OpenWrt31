#
# gen-config.yml
# 用途：云端生成一份【完整的】OpenWrt .config，下载后放回仓库根目录
#
# 【触发】仅手动：Actions → Generate .config (Manual) → Run workflow
# 【顺序】diy-part2.sh 必须先 push（Device 符号由它插进 cortexa7.mk 才有）
# 【用完】.config 落地后删掉本文件，一次性工具
#
# 【路径约定】源码放 $GITHUB_WORKSPACE/lede-src，不用 /workdir
#   /workdir 是 runner 的临时挂载点，step 之间会被回收，踩过坑了
#

name: Generate .config (Manual)

on:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:
    # ── 1. 拉自己的仓库（拿 diy-part1/2.sh）──
    - name: Checkout my repo
      uses: actions/checkout@main

    # ── 2. 最少依赖（不编译，只要能跑 defconfig）──
    - name: Install minimal deps
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential flex bison gawk gettext \
          libncurses5-dev libssl-dev python3 python3-setuptools rsync unzip \
          wget curl file g++-multilib libc6-dev-i386 zlib1g-dev device-tree-compiler
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ" || echo "timedatectl 跳过（容器无 systemd，无影响）"
        echo "DEPS_OK"

    # ── 3. 拉 lede 源码（★改成 workspace 内的目录★）──
    - name: Clone LEDE source
      run: |
        SRC="$GITHUB_WORKSPACE/lede-src"
        rm -rf "$SRC"
        mkdir -p "$SRC"
        cd "$SRC"
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf "$SRC/openwrt" "$GITHUB_WORKSPACE/openwrt"
        echo "SRC=$SRC"
        df -hT "$SRC"

    # ── 4. 跑 diy-part1.sh（feeds 配置，update 之前）──
    - name: Run diy-part1.sh
      run: |
        SRC="$GITHUB_WORKSPACE/lede-src/openwrt"
        cd "$SRC"
        if [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ]; then
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"
          echo "diy-part1: done"
        else
          echo "diy-part1: 不存在，跳过"
        fi

    - name: Update & install feeds
      run: |
        cd "$GITHUB_WORKSPACE/lede-src/openwrt"
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "FEEDS_OK"

    # ── 5. ★关键★ 跑 diy-part2.sh —— 注入 DTS + 插入 Device 块 ──
    - name: Run diy-part2.sh  ★注入 Device 定义★
      run: |
        cd "$GITHUB_WORKSPACE/lede-src/openwrt"
        [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ] || { echo "!! 找不到 $DIY_P2_SH"; exit 1; }
        chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
        "$GITHUB_WORKSPACE/$DIY_P2_SH"
        echo "---- 验证 Device 块 ----"
        grep -n 'inphic_mars-a31s' target/linux/sunxi/image/cortexa7.mk || { echo "!! Device 未注入"; exit 1; }
        echo "---- 验证 DTS ----"
        ls -l target/linux/sunxi/files/arch/arm/boot/dts/allwinner/ || exit 1

    # ── 6. ★核心★ 种符号 → defconfig 补全依赖 ──
    - name: Seed config & run defconfig
      run: |
        cd "$GITHUB_WORKSPACE/lede-src/openwrt"
        rm -f .config .config.old

        make defconfig                                   # 先给基线

        scripts/config set TARGET_sunxi y
        scripts/config set TARGET_sunxi_cortexa7 y
        scripts/config set TARGET_sunxi_cortexa7_DEVICE_inphic_mars-a31s y
        scripts/config set TESTING_KERNEL y              # 切内核 6.12
        scripts/config set TARGET_ROOTFS_CPIOGZ y        # initramfs，推内存必需
        scripts/config set TARGET_ROOTFS_PARTSIZE 256

        make defconfig                                   # 全量重算，补齐依赖

        echo "============= 结果核对（全为 1 才算成）============="
        for s in TARGET_sunxi TARGET_sunxi_cortexa7 \
                 TARGET_sunxi_cortexa7_DEVICE_inphic_mars-a31s \
                 TESTING_KERNEL TARGET_ROOTFS_CPIOGZ; do
          printf '%-45s = %s\n' "$s" "$(grep -c "^CONFIG_${s}=y$" .config)"
        done
        echo "---------- 内核版本（TESTING 槽=6.12）----------"
        grep -n 'KERNEL_PATCHVER' include/kernel-version.mk | head -5
        echo "---------- .config 行数（必须几千行）----------"
        wc -l .config

    # ── 7. 自检：符号缺一个就让 workflow 红，别传废文件 ──
    - name: Verify config sanity
      run: |
        cd "$GITHUB_WORKSPACE/lede-src/openwrt"
        fail=0
        for s in TARGET_sunxi TARGET_sunxi_cortexa7 \
                 TARGET_sunxi_cortexa7_DEVICE_inphic_mars-a31s \
                 TESTING_KERNEL TARGET_ROOTFS_CPIOGZ; do
          if ! grep -q "^CONFIG_${s}=y$" .config; then
            echo "!! 缺失: CONFIG_${s}=y"
            fail=1
          fi
        done
        [ "$fail" = "0" ] || exit 1
        echo "=== 5 个关键符号全部就位 ==="

    # ── 8. 传出 artifact ──
    - name: Upload .config artifact
      uses: actions/upload-artifact@main
      with:
        name: openwrt-dotconfig
        path: ${{ github.workspace }}/lede-src/openwrt/.config
        retention-days: 7
        if-no-files-found: error

    - name: Done hint
      run: |
        echo "下载 artifact → 解压 → 覆盖仓库根目录的 .config → push"
        echo "然后删除 .github/workflows/gen-config.yml"
