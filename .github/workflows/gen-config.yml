#
# gen-config.yml
# 用途：在云端生成一份【完整的】OpenWrt .config，供下载后放回仓库根目录
#
# 【为什么需要它】
#   仓库里那个 .config 是 P3TERX 模板的占位空文件（只有一行注释）。
#   .config 不能手写、也不能靠脚本拼三行 —— make defconfig 会按 Kconfig
#   依赖全量重算，手塞的行依赖不满足就被扔掉，编出来还是 x86。
#   本 workflow 借 Actions 的 Ubuntu，用 scripts/config 非交互式地种下
#   几个关键符号，再让 defconfig 自动补齐全量依赖，产出可直接用的 .config。
#
# 【触发方式】只手动。没有 push / pull_request / schedule，绝不会自动跑。
#   位置：GitHub 仓库 → Actions → Generate .config (Manual) → Run workflow
#
# 【顺序要求】diy-part2.sh 必须已 push！
#   因为 CONFIG_..._DEVICE_inphic_mars-a31s 这个符号是由 cortexa7.mk 里
#   TARGET_DEVICES += 生成的，而那个 Device 块正是 diy-part2.sh 插进去的。
#   脚本没跑，符号不存在，种了也白种。
#
# 【用完必须删】这个文件是一次性工具。.config 落地后就删掉，
#   否则它一直占着 Actions 列表，误触还会白跑。
#

name: Generate .config (Manual)

on:
  workflow_dispatch:          # ← 仅手动，无任何自动触发

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  TZ: Asia/Shanghai

jobs:
  generate:
    runs-on: ubuntu-22.04

    steps:
    # ── 1. 拉自己的仓库（拿 diy-part1/2.sh）──
    - name: Checkout my repo
      uses: actions/checkout@main

    # ── 2. 装最少的依赖（不编译，只要能跑 defconfig）──
    - name: Install minimal deps
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install build-essential flex bison gawk gettext \
          libncurses5-dev libssl-dev python3 python3-setuptools rsync unzip \
          wget curl file g++-multilib libc6-dev-i386 zlib1g-dev device-tree-compiler
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        echo "DEPS_OK"

    # ── 3. 拉 lede 源码 ──
    - name: Clone LEDE source

      run: |
        mkdir -p /workdir && cd /workdir
        git clone --depth 1 $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt
        df -hT /workdir

    # ── 4. 跑 diy-part1.sh（feeds 配置，在 update 之前）──
    - name: Run diy-part1.sh
      run: |
        cd /workdir/openwrt
        if [ -f "$GITHUB_WORKSPACE/$DIY_P1_SH" ]; then
          chmod +x "$GITHUB_WORKSPACE/$DIY_P1_SH"
          "$GITHUB_WORKSPACE/$DIY_P1_SH"
          echo "diy-part1: done"
        else
          echo "diy-part1: 不存在，跳过"
        fi

    - name: Update & install feeds
      run: |
        cd /workdir/openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a
        echo "FEEDS_OK"

    # ── 5. ★关键★ 跑 diy-part2.sh ──
    #     它把 DTS 注入内核树、并把 Device/inphic_mars-a31s 插进 cortexa7.mk
    #     不做这步，下面的 DEVICE_..._y 符号根本不存在
    - name: Run diy-part2.sh  ★注入 Device 定义★
      run: |
        cd /workdir/openwrt
        [ -f "$GITHUB_WORKSPACE/$DIY_P2_SH" ] || { echo "!! 找不到 $DIY_P2_SH"; exit 1; }
        chmod +x "$GITHUB_WORKSPACE/$DIY_P2_SH"
        "$GITHUB_WORKSPACE/$DIY_P2_SH"
        echo "---- 验证 Device 块确实进去了 ----"
        grep -n 'inphic_mars-a31s' target/linux/sunxi/image/cortexa7.mk || { echo "!! Device 块未注入，中止"; exit 1; }
        echo "---- 验证 DTS 确实进去了 ----"
        ls -l target/linux/sunxi/files/arch/arm/boot/dts/allwinner/ || exit 1

    # ── 6. ★核心★ 种下关键符号，再让 defconfig 补全依赖 ──
    - name: Seed config & run defconfig
      run: |
        cd /workdir/openwrt
        rm -f .config .config.old

        # 先给一个空壳，defconfig 才有基线
        make defconfig

        # 逐项种下。scripts/config 是 OpenWrt 自带的命令行改配置工具
        scripts/config set TARGET_sunxi y
        scripts/config set TARGET_sunxi_cortexa7 y
        scripts/config set TARGET_sunxi_cortexa7_DEVICE_inphic_mars-a31s y

        # 切内核到 6.12（KERNEL_PATCHVER 的默认槽是 6.18，TESTING 槽才是 6.12）
        scripts/config set TESTING_KERNEL y

        # initramfs：没有它就没有 -initramfs-kernel.bin，FEL 推内存白推
        scripts/config set TARGET_ROOTFS_CPIOGZ y

        # 调试期把日志开满，定稿后再去掉
        scripts/config set TARGET_ROOTFS_PARTSIZE 256

        # 让它按依赖关系全量重算，补上几千行被依赖的项
        make defconfig

        echo "================ 结果核对 ================"
        for s in TARGET_sunxi TARGET_sunxi_cortexa7 \
                 TARGET_sunxi_cortexa7_DEVICE_inphic_mars-a31s \
                 TESTING_KERNEL TARGET_ROOTFS_CPIOGZ; do
          printf '%-45s = %s\n' "$s" "$(grep -c "^CONFIG_${s}=y$" .config)"
        done
        echo "---- 实际生效的内核版本 ----"
        grep -n 'KERNEL_PATCHVER' include/kernel-version.mk 2>/dev/null | head -5
        echo "---- .config 行数 ----"
        wc -l .config

    # ── 7. 自检：符号没生效就直接让 workflow 红掉，别传出一份废的 ──
    - name: Verify config sanity
      run: |
        cd /workdir/openwrt
        fail=0
        for s in TARGET_sunxi TARGET_sunxi_cortexa7 \
                 TARGET_sunxi_cortexa7_DEVICE_inphic_mars-a31s \
                 TESTING_KERNEL TARGET_ROOTFS_CPIOGZ; do
          if ! grep -q "^CONFIG_${s}=y$" .config; then
            echo "!! 缺失或未生效: CONFIG_${s}=y"
            fail=1
          fi
        done
        [ "$fail" = "0" ] || { echo "=== 校验失败，看看上面哪个符号被依赖否掉了 ==="; exit 1; }
        echo "=== 5 个关键符号全部就位 ==="

    # ── 8. 传出 artifact ──
    - name: Upload .config artifact
      uses: actions/upload-artifact@main
      with:
        name: openwrt-dotconfig
        path: /workdir/openwrt/.config
        retention-days: 7
        if-no-files-found: error

    - name: Done hint
      run: |
        echo "下载 artifact → 解压得 .config → 覆盖仓库根目录的空 .config → push"
        echo "然后：删除 .github/workflows/gen-config.yml（一次性工具，别留着）"
