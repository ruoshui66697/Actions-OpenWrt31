name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  DTS_NAME: sun6i-a31s-mars-a31s
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: |
        set +e   # Actions 默认带 -e，关掉它，降级链要自己判返回码
        cd openwrt

        FEEDS="packages luci routing telephony helloworld video"
        GH_PREFIX="https://ghproxy.net/https://github.com/"
        # 备用代理域名可用性我没验证过，不确定；要换就改这一行默认值，
        # 或在 workflow 的 env 块加同名 FEEDS_PROXY_2 覆盖
        PROXY_2="${FEEDS_PROXY_2:-https://ghfast.top/https://github.com/}"

        check_feeds() {
          miss=0
          for f in $FEEDS; do
            if [ ! -e "feeds/$f/.git" ] || [ -z "$(ls -A "feeds/$f" 2>/dev/null)" ]; then
              echo "[feeds]   缺失/不完整: feeds/$f"
              miss=1
            fi
          done
          return $miss
        }

        clear_rewrite() {
          git config --global --unset-all url."https://github.com/".insteadOf 2>/dev/null
          git config --global --unset-all url."$PROXY_2".insteadOf 2>/dev/null
          return 0
        }

        try_update() {
          label="$1"
          echo "[feeds] ===== 尝试：$label ====="
          rm -rf feeds/* 2>/dev/null
          ./scripts/feeds update -a
          rc=$?
          echo "[feeds] update 退出码=$rc（仅参考，以目录校验为准）"
          if check_feeds; then
            echo "[feeds] ✅ $label 成功：六个 feed 目录齐全"
            return 0
          fi
          echo "[feeds] ❌ $label 失败：目录校验未过，继续降级"
          return 1
        }

        # 第 1 级：原配置（feeds.conf.default 里的 ghproxy 前缀，一字不动）
        clear_rewrite
        OK=0
        if try_update "第1级 原配置(ghproxy)"; then OK=1; fi

        # 第 2 级：直连 —— git 层透明重写，不改配置文件
        if [ "$OK" -eq 0 ]; then
          clear_rewrite
          git config --global url."https://github.com/".insteadOf "$GH_PREFIX"
          if try_update "第2级 直连 GitHub"; then OK=1; fi
        fi

        # 第 3 级：第二代理（同样用 git 重写）
        if [ "$OK" -eq 0 ]; then
          clear_rewrite
          git config --global url."$PROXY_2".insteadOf "$GH_PREFIX"
          if try_update "第3级 第二代理 ($PROXY_2)"; then OK=1; fi
        fi

        if [ "$OK" -eq 0 ]; then
          echo "[feeds] ❌ 三级兜底全部失败，目录仍不齐，硬失败在这里"
          echo "[feeds] ---- 当前 feeds 目录实况 ----"
          ls -la feeds/ 2>/dev/null
          exit 1
        fi

        # 成功后：后续 feeds install / make download 等 git 请求统一走直连，
        # 别带着可能不稳的代理配置往下跑
        clear_rewrite
        git config --global url."https://github.com/".insteadOf "$GH_PREFIX"
        echo "[feeds] 后续 git 请求统一重写为直连，配置文件未改动"
        echo "[feeds] ---- 六个 feed 目录 ----"
        for f in $FEEDS; do echo "  feeds/$f: $(ls -A feeds/$f 2>/dev/null | wc -l) 项"; done

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # =========================================================================
    # ★ 新增 step：Prepare kernel tree
    # -------------------------------------------------------------------------
    # make defconfig / make download 只备配置和源码包，不解压内核树。
    # 内核树与 files-6.12 覆盖层是 target/linux/prepare 铺出来的。
    # 必须先 prepare，Inject 才有目录可插；这是 test yml 已实锤的时序。
    #
    # 提前单独跑过 prepare 后，后面全量 make 靠 stamp 跳过 prepare，
    # 不会重铺覆盖层、不会冲掉 dtb-y 注入（OpenWrt 标准 stamp 机制）。
    # =========================================================================
    - name: Prepare kernel tree
      run: |
        cd openwrt
        make target/linux/prepare -j$(nproc) V=s

    # =========================================================================
    # ★ Inject MARS A31s dtb-y（与 openwrt-test.yml 同一套已验证逻辑）
    # -------------------------------------------------------------------------
    # 时机：必须在 Prepare kernel tree 之后、全量 make 之前。
    #   早于 prepare 插 = build_dir 里还没有内核树 = KDIR 空 = 必然跳过。
    #   （旧版注释放这里时写"make defconfig 跑完内核树已存在"，是错的。）
    #
    # 不用 kernel patch：patch 头注释被当文件名、上下文与源码不符，已删除。
    # 不挂 CONFIG_MACH_...：无条件 dtb-y +=，少一环 Kconfig 失败点。
    # 不依赖 DEVICE_DTS：这套 Makefile 靠 SOC 自动拼文件名。
    #
    # 硬失败：KDIR 找不到 / dts 正本缺失 / 插入后校验不过，一律 exit 1。
    #   sed 即使没匹配到任何行也返回 0，光看退出码会误报成功；
    #   旧版"找不到就 exit 0 让编译继续"只会把红点推迟到 mkits，更难定位。
    # =========================================================================
    - name: Inject MARS A31s dtb-y
      run: |
        cd openwrt

        KDIR="$(ls -d build_dir/target-arm_cortex-a7+neon-vfpv4_musl_eabi/linux-sunxi_cortexa7/linux-6.12.* 2>/dev/null | head -1)" || true
        if [ -z "$KDIR" ] || [ ! -d "$KDIR/arch/arm/boot/dts/allwinner" ]; then
          echo "[inject] ❌ prepare 之后仍找不到内核 dts 目录（KDIR=${KDIR:-空}）"
          echo "[inject] 检查上一步 Prepare kernel tree 日志。"
          exit 1
        fi
        K_DTS_DIR="$KDIR/arch/arm/boot/dts/allwinner"
        MK="$K_DTS_DIR/Makefile"
        DTS_SRC="$GITHUB_WORKSPACE/dts/${DTS_NAME}.dts"
        echo "[inject] 内核 dts 目录 = $K_DTS_DIR"

        # 兜底：dts 若没被 files-6.12 铺进来，直接补一份
        if [ ! -f "$K_DTS_DIR/${DTS_NAME}.dts" ]; then
          if [ -f "$DTS_SRC" ]; then
            cp -f "$DTS_SRC" "$K_DTS_DIR/${DTS_NAME}.dts"
            echo "[inject] 已兜底拷入 dts -> $K_DTS_DIR/${DTS_NAME}.dts"
          else
            echo "[inject] ❌ 仓库里也找不到 dts 正本: $DTS_SRC"
            exit 1
          fi
        else
          echo "[inject] dts 已在内核树中（files-6.12 覆盖层生效）"
        fi

        # 幂等：只认我们自己插的独立行
        if grep -qE "^dtb-y \+= ${DTS_NAME}\.dtb$" "$MK"; then
          echo "[inject] Makefile 已含 dtb-y += ${DTS_NAME}.dtb，跳过（幂等）"
        else
          # 锚定首个 dtb-$(CONFIG_MACH_*) 续行块之前，插到块外、独立成行。
          # 旧版 sed 的 0,/^dtb-y/ 在这个 Makefile 里永不命中（没有 ^dtb-y 行），
          # 会静默空转还 echo "已插入"，是 dtb 产不出的真凶。
          python3 - "$MK" "${DTS_NAME}" <<'PY'
        import sys, re
        mk, dts = sys.argv[1], sys.argv[2]
        lines = open(mk, encoding='utf-8').read().split('\n')
        idx = next((i for i, l in enumerate(lines)
                    if re.match(r'^dtb-\$\(CONFIG_MACH_[A-Z0-9]+\)\s*\+?=', l)), 0)
        lines.insert(idx, f"dtb-y += {dts}.dtb")
        open(mk, 'w', encoding='utf-8').write('\n'.join(lines))
        print(f"[inject] 已插入 dtb-y 条目（第 {idx+1} 行）")
        PY
        fi

        # 硬校验：确认条目真在 Makefile 里，避免空转报成功
        if grep -qE "^dtb-y \+= ${DTS_NAME}\.dtb$" "$MK"; then
          echo "[inject] ✅ 校验通过：Makefile 中已存在条目"
        else
          echo "[inject] ❌ 插入失败：Makefile 中仍无条目"
          echo "[inject] ---- Makefile 前 12 行 ----"
          head -12 "$MK"
          exit 1
        fi

        echo "[inject] ---- 插入点上下文 ----"
        grep -n -B2 -A2 "${DTS_NAME}.dtb" "$MK" || true
        echo "[inject] ---- mars 相关文件 ----"
        ls -l "$K_DTS_DIR/" | grep -i 'mars' || echo "(暂无 mars 文件)"
        exit 0

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        # Prepare 已在前面单独跑过，全量 make 靠 stamp 跳过 prepare，
        # 不会重铺覆盖层冲掉注入；|| exit 1 修掉原模板"编译全挂仍写 success"的假成功。
        make -j$(nproc) || make -j1 || make -j1 V=s || exit 1

        # 硬校验：编译跑完立刻确认 dtb 在（对齐 test yml 的 verify 纪律）。
        # 若全量 make 意外重铺了覆盖层，这里立刻红，不用等到镜像打包段。
        KDIR="$(ls -d build_dir/target-arm_cortex-a7+neon-vfpv4_musl_eabi/linux-sunxi_cortexa7/linux-6.12.* 2>/dev/null | head -1)" || true
        DTB="$KDIR/arch/arm/boot/dts/allwinner/${DTS_NAME}.dtb"
        if [ -f "$DTB" ]; then
          echo "[compile] ✅ dtb 已产出: $DTB"
        else
          echo "[compile] ❌ dtb 未产出 —— 注入可能被 prepare 重铺冲掉，或 dtb-y 未生效"
          echo "[compile] Makefile 条目:"
          grep -n "${DTS_NAME}.dtb" "$KDIR/arch/arm/boot/dts/allwinner/Makefile" || echo "(无)"
          exit 1
        fi

        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    # =========================================================================
    # ★ 新增 step：Collect first-boot payloads from build_dir
    # -------------------------------------------------------------------------
    # 目的：把第一轮上板要用的 kernel 载荷收进 OpenWrt_firmware 附件。
    # 它们只产在 build_dir，不在 bin/targets 归集范围，原流程没人收。
    #
    # 位置：必须在 Organize files 之后（它才写好 FIRMWARE 并 rm -rf packages）、
    #       Upload firmware directory 之前（同一目录，自动进同一个 artifact）。
    #
    # 条件：用 !cancelled() 对齐 Organize files —— 全量 make 可能因 sdcard
    #       支线（缺 boot.scr 的 mcopy）红掉，但 kernel/dtb/FIT 在那之前
    #       已经产出；不能依赖 steps.compile.outputs.status（挂了就不会写）。
    #
    # 不吞任何错误、不改 make 结果、不动 boot.scr：job 该红还是红，
    #       这一步只保证"附件里有货"，不制造假绿。
    # 缺件只回显警告 + 末尾清单，以附件实际内容为准，不假装齐全。
    # =========================================================================
    - name: Collect first-boot payloads
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt
        if [ -z "${FIRMWARE:-}" ] || [ ! -d "${FIRMWARE:-}" ]; then
          echo "[collect] ❌ FIRMWARE 目录不可用，跳过收集（请看 Organize files 日志）"
          exit 0
        fi

        BDIR="build_dir/target-arm_cortex-a7+neon-vfpv4_musl_eabi/linux-sunxi_cortexa7"
        KDIR="$(ls -d "$BDIR"/linux-6.12.* 2>/dev/null | head -1)" || true
        DTB="${KDIR:-}/arch/arm/boot/dts/allwinner/${DTS_NAME}.dtb"

        # 三样：FIT 包（内嵌 kernel+dtb）、独立 dtb、裸 zImage。
        # FIT 最终名 yml 里看不出来（mkimage 写 .new，make 规则再收敛成不带后缀），
        # 两个候选都找，日志标明实际取了哪个，不预判。
        FIT=""
        for f in "$BDIR/inphic_mars-a31s-kernel.bin" "$BDIR/inphic_mars-a31s-kernel.bin.new"; do
          if [ -f "$f" ]; then FIT="$f"; break; fi
        done

        copy_one() {
          src="$1"; label="$2"
          if [ -n "$src" ] && [ -f "$src" ]; then
            cp -f "$src" "$FIRMWARE/"
            echo "[collect] ✅ $label <- $src ($(stat -c%s "$src") bytes)"
          else
            echo "[collect] ⚠️  $label 未找到，本轮不收集（不假成功）"
          fi
        }

        copy_one "$FIT"        "FIT(kernel+dtb 同包)"
        copy_one "$DTB"        "独立 dtb"
        copy_one "$BDIR/zImage" "裸 zImage"

        echo "[collect] ---- FIRMWARE 目录实际清单（以附件内容为准）----"
        ls -lh "$FIRMWARE"
        exit 0

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ ${UPLOAD_GOFILE} = true && ${{ steps.gofile.outputs.url }} ] && echo "🔗 [GoFile](${{ steps.gofile.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
