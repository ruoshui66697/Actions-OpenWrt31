name: OpenWrt Builder

on:
  repository_dispatch:
  workflow_dispatch:

env:
  REPO_URL: https://github.com/coolsnowwolf/lede
  REPO_BRANCH: master
  FEEDS_CONF: feeds.conf.default
  CONFIG_FILE: .config
  DIY_P1_SH: diy-part1.sh
  DIY_P2_SH: diy-part2.sh
  UPLOAD_BIN_DIR: false
  UPLOAD_FIRMWARE: true
  UPLOAD_RELEASE: true
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout
      uses: actions/checkout@main

    - name: Initialization environment
      env:
        DEBIAN_FRONTEND: noninteractive
      run: |
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
        sudo docker image prune --all --force
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install ack antlr3 asciidoc autoconf automake autopoint binutils bison build-essential bzip2 ccache cmake cpio curl device-tree-compiler fastjar flex gawk gettext gcc-multilib g++-multilib git gperf haveged help2man intltool libc6-dev-i386 libelf-dev libfuse-dev libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses5-dev libncursesw5-dev libpython3-dev libreadline-dev libssl-dev libtool lrzsz mkisofs msmtp ninja-build p7zip p7zip-full patch pkgconf python2.7 python3 python3-pyelftools python3-setuptools qemu-utils rsync scons squashfs-tools subversion swig texinfo uglifyjs upx-ucl unzip vim wget xmlto xxd zlib1g-dev
        sudo -E apt-get -qq autoremove --purge
        sudo -E apt-get -qq clean
        sudo timedatectl set-timezone "$TZ"
        sudo mkdir -p /workdir
        sudo chown $USER:$GROUPS /workdir

    - name: Clone source code
      working-directory: /workdir
      run: |
        df -hT $PWD
        git clone $REPO_URL -b $REPO_BRANCH openwrt
        ln -sf /workdir/openwrt $GITHUB_WORKSPACE/openwrt

    - name: Load custom feeds
      run: |
        [ -e $FEEDS_CONF ] && mv $FEEDS_CONF openwrt/feeds.conf.default
        chmod +x $DIY_P1_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P1_SH

    - name: Update feeds
      run: cd openwrt && ./scripts/feeds update -a

    - name: Install feeds
      run: cd openwrt && ./scripts/feeds install -a

    - name: Load custom configuration
      run: |
        [ -e files ] && mv files openwrt/files
        [ -e $CONFIG_FILE ] && mv $CONFIG_FILE openwrt/.config
        chmod +x $DIY_P2_SH
        cd openwrt
        $GITHUB_WORKSPACE/$DIY_P2_SH

    - name: Download package
      id: package
      run: |
        cd openwrt
        make defconfig
        make download -j8
        find dl -size -1024c -exec ls -l {} \;
        find dl -size -1024c -exec rm -f {} \;

    # =========================================================================
    # ★本次唯一新增 step★ Inject MARS A31s dtb-y
    # -------------------------------------------------------------------------
    # 为什么必须放在这里（Download package 之后 / Compile 之前）:
    #   1) diy-part2.sh 执行时（Load custom configuration 步）内核树还没解压，
    #      实测日志 KDIR=空，sed 必然跳过 —— 不是脚本 bug，是时机不对。
    #   2) make defconfig 跑完之后，build_dir/.../linux-6.12.x/ 已存在，
    #      内核 dts 目录的 Makefile 已就位，这时候插 dtb-y 才来得及被编译。
    #   3) 早于 make -j，所以插进去的条目会被真正编译成 .dtb。
    #
    # 为什么不用 kernel patch:
    #   901-mars-a31s-dts.patch 已删除。原因：patch 文件头写了 # 注释块，
    #   patch 命令把注释当文件名 -> can't find file to patch input line 25；
    #   且上下文行与内核 6.12.119 原文不符 -> malformed patch at line 66。
    #   sed 直插无上下文匹配，不会 Hunk FAILED。
    #
    # 为什么直接写 dtb-y += 而不挂 CONFIG_MACH_...:
    #   挂 CONFIG 需要在 Kconfig 里加符号，少一环失败点。无条件编译这条
    #   dts 对单设备固件没有副作用。
    #
    # 容错原则: 任何一步找不到都 exit 0，不致命。
    #   找不到时让编译继续，报错信息会更准确（mkits 会明确指出缺哪个 dtb）。
    # =========================================================================
    - name: Inject MARS A31s dtb-y
      run: |
        cd openwrt
        DTS_NAME="sun6i-a31s-mars-a31s"
        DTS_SRC="$GITHUB_WORKSPACE/dts/${DTS_NAME}.dts"

        # 1) 定位内核源码树（通配符匹配不到时 || true 防止 set -e 杀掉流程）
        KDIR="$(ls -d build_dir/target-arm_cortex-a7+neon-vfpv4_musl_eabi/linux-sunxi_cortexa7/linux-6.12.* 2>/dev/null | head -1)" || true
        if [ -z "$KDIR" ] || [ ! -d "$KDIR/arch/arm/boot/dts/allwinner" ]; then
          echo "[inject] 内核树尚未就绪（KDIR=${KDIR:-空}），跳过 dtb-y 插入。"
          echo "[inject] 编译阶段会报 mkits 找不到 .dtb，属预期内的兜底提示。"
          exit 0
        fi
        K_DTS_DIR="$KDIR/arch/arm/boot/dts/allwinner"
        echo "[inject] 内核 dts 目录 = $K_DTS_DIR"

        # 2) 兜底拷贝：files-6.12 覆盖层在 make 阶段才铺，
        #    这里若发现 dts 还没进内核树，直接补一份，保证编译有源文件。
        if [ ! -f "$K_DTS_DIR/${DTS_NAME}.dts" ]; then
          if [ -f "$DTS_SRC" ]; then
            cp -f "$DTS_SRC" "$K_DTS_DIR/${DTS_NAME}.dts"
            echo "[inject] 已兜底拷入 dts -> $K_DTS_DIR/${DTS_NAME}.dts"
          else
            echo "[inject] 警告：仓库里也找不到 $DTS_SRC，仅插 Makefile 条目。"
          fi
        else
          echo "[inject] dts 已在内核树中，无需拷贝。"
        fi

        # 3) 插 Makefile 条目（幂等：已有则跳过，反复跑不会重复插）
        if grep -q "${DTS_NAME}.dtb" "$K_DTS_DIR/Makefile"; then
          echo "[inject] Makefile 已含 ${DTS_NAME}.dtb，跳过（幂等）"
        else
          sed -i "0,/^dtb-y/s|^dtb-y|dtb-y += ${DTS_NAME}.dtb\n\ndtby-|" "$K_DTS_DIR/Makefile"
          echo "[inject] 已插入 dtb-y 条目 -> $K_DTS_DIR/Makefile"
        fi

        # 4) 回显确认，方便在日志里一眼定性
        echo "[inject] ---- Makefile 前 6 行 ----"
        head -6 "$K_DTS_DIR/Makefile"
        echo "[inject] ---- mars 相关文件 ----"
        ls -l "$K_DTS_DIR/" | grep -i 'mars' || echo "(暂无 mars 文件)"
        exit 0

    - name: Compile the firmware
      id: compile
      run: |
        cd openwrt
        echo -e "$(nproc) thread compile"
        make -j$(nproc) || make -j1 || make -j1 V=s
        echo "status=success" >> $GITHUB_OUTPUT
        grep '^CONFIG_TARGET.*DEVICE.*=y' .config | sed -r 's/.*DEVICE_(.*)=y/\1/' > DEVICE_NAME
        [ -s DEVICE_NAME ] && echo "DEVICE_NAME=_$(cat DEVICE_NAME)" >> $GITHUB_ENV
        echo "FILE_DATE=_$(date +"%Y%m%d%H%M")" >> $GITHUB_ENV

    - name: Check space usage
      if: (!cancelled())
      run: df -hT

    - name: Upload bin directory
      uses: actions/upload-artifact@main
      if: steps.compile.outputs.status == 'success' && env.UPLOAD_BIN_DIR == 'true'
      with:
        name: OpenWrt_bin${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: openwrt/bin

    - name: Organize files
      id: organize
      if: env.UPLOAD_FIRMWARE == 'true' && !cancelled()
      run: |
        cd openwrt/bin/targets/*/*
        rm -rf packages
        echo "FIRMWARE=$PWD" >> $GITHUB_ENV
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware directory
      uses: actions/upload-artifact@main
      if: steps.organize.outputs.status == 'success' && !cancelled()
      with:
        name: OpenWrt_firmware${{ env.DEVICE_NAME }}${{ env.FILE_DATE }}
        path: ${{ env.FIRMWARE }}

    - name: Generate release tag
      id: tag
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      run: |
        echo "release_tag=$(date +"%Y.%m.%d-%H%M")" >> $GITHUB_OUTPUT
        touch release.txt
        [ ${UPLOAD_GOFILE} = true && ${{ steps.gofile.outputs.url }} ] && echo "🔗 [GoFile](${{ steps.gofile.outputs.url }})" >> release.txt
        echo "status=success" >> $GITHUB_OUTPUT

    - name: Upload firmware to release
      uses: softprops/action-gh-release@master
      if: steps.tag.outputs.status == 'success' && !cancelled()
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        tag_name: ${{ steps.tag.outputs.release_tag }}
        body_path: release.txt
        files: ${{ env.FIRMWARE }}/*

    - name: Delete workflow runs
      uses: Mattraks/delete-workflow-runs@main
      with:
        retain_days: 0
        keep_minimum_runs: 2

    - name: Remove old Releases
      uses: dev-drprasad/delete-older-releases@master
      if: env.UPLOAD_RELEASE == 'true' && !cancelled()
      with:
        keep_latest: 3
        delete_tags: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
